name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, build e testes
    runs-on: ubuntu-latest
    # Um Redis de verdade para os testes que só aparecem com o servidor vivo (reconexão, espera do "pronto", pipelines)
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: FFmpeg (as rotas de mídia e o E2E rodam FFmpeg de verdade)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: mkv_extractor (pytest)
        run: |
          python -m pip install pytest
          python -m pytest tests
      - name: Servidor de salas e rotas (Vitest, com Redis real)
        run: npm test
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379
          REDIS_TEST_ALLOW_KILL: '1' # o service container é só deste job: pode derrubar conexões

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # O vídeo vem de um MKV gerado pelo FFmpeg e servido localmente: não depende de TorBox nem de internet
      - run: npx playwright test
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
